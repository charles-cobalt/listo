  else if(a==='up'){const c=await createUserWithEmailAndPassword(auth,em,pw);try{await sendEmailVerification(c.user);msg='Account created. Verification email sent.'}catch(e){}}
  else await signInWithEmailAndPassword(auth,em,pw)}catch(e){msg=({'auth/invalid-credential':'Wrong email or password.','auth/email-already-in-use':'That email already has an account.','auth/weak-password':'Password needs at least 6 characters.','auth/invalid-email':'That email does not look right.','auth/missing-password':'Enter a password.'})[e.code]||('Could not complete: '+e.code)}draw()});
 const out=$('#out');if(out)out.onclick=()=>signOut(auth);
 const ck=$('#chk');if(ck)ck.onclick=async()=>{try{await user.reload();msg=auth.currentUser.emailVerified?'Email verified.':'Not verified yet.'}catch(e){msg='Try again in a minute.'}draw()};
 const sn=$('#syncnow');if(sn)sn.onclick=()=>{msg='Syncing...';draw();schedPush(0)};
 const rs=$('#resend');if(rs)rs.onclick=async()=>{try{await sendEmailVerification(user);msg='Verification email sent.'}catch(e){msg='Try again in a minute.'}draw()};
 const ro=$('#r-open');if(ro)ro.onclick=()=>{rstOpen=true;rchk=false;rtxt='';rnote='';draw()};
 const rn=$('#r-no');if(rn)rn.onclick=()=>{rstOpen=false;rchk=false;rtxt='';rnote='';draw()};
 const rc=$('#r-chk');if(rc)rc.onclick=()=>{rchk=!rchk;draw()};
 const rb=$('#r-bk');if(rb)rb.onclick=()=>{dlFile('listo-backup_'+new Date().toISOString().slice(0,10)+'.json',backupFile(),'application/json');rnote='Backup file downloaded.';draw()};
 const rt=$('#rtxt');if(rt)rt.oninput=()=>{rtxt=rt.value;const ok=rchk&&rtxt.trim().toUpperCase()==='RESET',b=$('#rgo');if(b){b.classList.toggle('sec',!ok);b.style.opacity=ok?'':'.4'}};
 const rg=$('#rgo');if(rg)rg.onclick=()=>{if(rchk&&rtxt.trim().toUpperCase()==='RESET'){comps=[];presets=[];sum=[];localStorage.setItem(RSK,String(Date.now()));persist();rstOpen=false;rchk=false;rtxt='';rnote='Account reset. Everything is empty.'}else rnote='Tick the box and type RESET first.';draw()}}
function draw(top){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.go===page));
 const v=$('#view'),y=top?0:scrollY;
 if(page==='sum')drawSum(v);else if(page==='components')drawComponents(v);else drawSettings(v);
 scrollTo(0,y)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{page=b.dataset.go;note='';clraOpen=false;clraTxt='';rpOpen=false;rpSel='';draw(true)});
$('#home').onclick=()=>{page='sum';note='';clraOpen=false;clraTxt='';rpOpen=false;rpSel='';draw(true)};
(function boot(){const s=jl(localStorage.getItem(DK));if(s){comps=s.c||[];presets=s.p||[];sum=s.s||[]}migrate()})();
onAuthStateChanged(auth,u=>{user=u;if(unsub){unsub();unsub=null}
 if(u){switchOwner(u.uid);unsub=onSnapshot(doc(db,'users',u.uid),s=>{if(!s.metadata.hasPendingWrites)schedPush(50)},e=>{msg='Sync unavailable: '+e.code;if(page==='settings')draw()});schedPush(50)}
 else switchOwner('');
 draw()});
applyTheme();draw();
</script></body></html>
